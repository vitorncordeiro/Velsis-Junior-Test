spring:

  application:
    name: versis
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:123}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
application:
  jwt: ${JWT_TOKEN:123}